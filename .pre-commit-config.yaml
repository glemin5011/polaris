minimum_pre_commit_version: "4.0.0"

default_install_hook_types:
  - pre-commit
  - pre-push

fail_fast: false

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format staged Python files
        entry: uv run --project apps/api ruff format
        language: system
        files: '^apps/api/.*\.py$'
        require_serial: true
        stages:
          - pre-commit

      - id: ruff-check
        name: Ruff lint staged Python files
        entry: uv run --project apps/api ruff check
        language: system
        files: '^apps/api/.*\.py$'
        stages:
          - pre-commit

      - id: prettier
        name: Prettier format staged files
        entry: pnpm exec prettier --write
        language: system
        files: '\.(?:[cm]?[jt]sx?|json|mdx?|css|ya?ml)$'
        require_serial: true
        stages:
          - pre-commit

      - id: generate-openapi
        name: Generate the OpenAPI contract
        entry: pnpm run openapi
        language: system
        pass_filenames: false
        require_serial: true
        files: '^(apps/api/src/.*\.py|apps/api/pyproject\.toml|apps/api/uv\.lock|apps/api/scripts/export_openapi\.py|contracts/openapi\.json)$'
        stages:
          - pre-commit

      - id: workspace-lint
        name: Workspace lint (Ruff and ESLint)
        entry: pnpm run lint
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push

      - id: workspace-typecheck
        name: Workspace type checking (Pyright and TypeScript)
        entry: pnpm run check-types
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push

      - id: api-tests
        name: FastAPI tests
        entry: uv run --project apps/api pytest
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push

      - id: check-openapi
        name: Check the OpenAPI contract
        entry: pnpm run openapi:check
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
